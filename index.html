<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./favicon.png">
<title>おくすり管理</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
    transition: background-color 0.8s ease, color 0.8s ease;
  }
  header {
    padding: 30px;
    background: #ffffff;
    text-align: center;
    font-size: 54px;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
    transition: background-color 0.8s ease, color 0.8s ease;
  }
  nav {
    display: flex;
    background: #ffffff;
    border-bottom: 1px solid #ddd;
    transition: background-color 0.8s ease, color 0.8s ease;
  }
  nav button {
    flex: 1;
    padding: 24px;
    font-size: 42px;
    border: none;
    background: none;
    font-weight: bold;
    color: #2196F3;
    transition: background-color 0.8s ease, color 0.8s ease;
  }
  nav button.active {
    background: #d0d0d0;
  }
  main {
    padding: 30px;
  }
  #date {
    font-size: 50px;
    margin: 16px;
  }
  #sync-status {
    font-size: 22px;
    color: #999;
    margin-top: 6px;
  }
  h2 {
    text-align: center;
    font-size: 24px;
  }
  .medicine {
    display: flex;
    align-items: center;
    padding: 32px;
    margin-bottom: 20px;
    background: #ffffff;
    border-radius: 8px;
    font-size: 42px;
    cursor: pointer;
    transition: background-color 0.8s ease, color 0.8s ease, opacity 0.4s ease;
  }
  .medicine.taken {
    opacity: 0.5;
  }
  .check {
    width: 40px;
    height: 40px;
    min-width: 40px;
    margin-right: 12px;
    border-radius: 50%;
    border: 2px solid #666;
    background: #fff;
    transition: background-color 0.8s ease, border-color 0.8s ease;
  }
  .medicine.taken .check {
    background: #4caf50;
    border-color: #4caf50;
  }
  /* ナイトテーマ */
  body.night-theme {
    background: #121212;
    color: #ffffff;
  }
  body.night-theme header,
  body.night-theme nav,
  body.night-theme .medicine {
    background: #1e1e1e;
    color: #ffffff;
  }
  body.night-theme nav {
    border-bottom: 1px solid #444;
  }
  body.night-theme header {
    border-bottom: 1px solid #444;
  }
  body.night-theme .medicine {
    border: 1px solid #333;
  }
  body.night-theme .check {
    border-color: #bbb;
    background: #222;
  }
  body.night-theme nav button {
    color: #90caf9;
  }
  body.night-theme nav button.active {
    background: #333;
  }
  /* ランプフェード */
  body.lamp-fade {
    background: #8f8676;
    color: #ffffff;
  }
  body.lamp-fade header,
  body.lamp-fade nav,
  body.lamp-fade .medicine {
    background: #8f8676;
    color: #ffffff;
    border-color: #8f8676;
  }
  body.lamp-fade nav button {
    background: #8f8676;
    color: #ffffff;
  }
  body.lamp-fade .check {
    background: #8f8676;
    border-color: #ffffff;
  }
</style>
</head>
<body>
<header id="header">
  💊 おくすり<br>管理
  <div id="date"></div>
</header>
<nav>
  <button id="btn-morning" onclick="showPage('morning')">朝</button>
  <button id="btn-night" onclick="showPage('night')">夜</button>
</nav>
<main id="list"></main>
<h2>
服薬状況は毎日リセットされるので安心してください。
</h2>

<!-- Firebase SDK (compat版：シンプルに script タグだけで使えるもの) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<script>
/* ===== Firebase 初期化 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBTx13Aefx1tnx2jQndjWdtJfw2bzx64bo",
  authDomain: "okusuri-76a62.firebaseapp.com",
  databaseURL: "https://okusuri-76a62-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "okusuri-76a62",
  storageBucket: "okusuri-76a62.firebasestorage.app",
  messagingSenderId: "1089175572283",
  appId: "1:1089175572283:web:ccca081a1550d290f3311e",
  measurementId: "G-P706VW2JDC"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const dbRef = db.ref("okusuri");

/* ===== 状態（すべて最初にまとめて宣言） ===== */
let medicines = [];
let lastDate = null;
let firstSync = true;
let current = "morning";

/* ===== 音声 ===== */
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "ja-JP";
  msg.rate = 0.9;
  msg.pitch = 1.0;
  msg.volume = 1.0;
  speechSynthesis.speak(msg);
}

/* オフライン用キャッシュ（起動直後の一瞬だけ使う） */
function loadCache() {
  const cached = localStorage.getItem("medicines");
  if (cached) medicines = JSON.parse(cached);
  const cachedDate = localStorage.getItem("lastDate");
  if (cachedDate) lastDate = cachedDate;
}
function saveCache() {
  localStorage.setItem("medicines", JSON.stringify(medicines));
  if (lastDate) localStorage.setItem("lastDate", lastDate);
}

function setSyncStatus(text) {
  const el = document.getElementById("sync-status");
  if (el) el.textContent = text;
}

/* Firebaseへ現在の状態を書き込む */
function save() {
  saveCache();
  dbRef.set({ medicines, lastDate })
    .then(() => setSyncStatus(""))
    .catch(() => setSyncStatus("⚠ 同期できていません（オフライン）"));
}

/* ===== 状況読み上げ ===== */
function announceStatus() {
  const timing = new Date().getHours() < 15 ? "morning" : "night";
  const morningRemaining = medicines.filter(m => m.timing === "morning" && !m.taken);
  const nightRemaining = medicines.filter(m => m.timing === "night" && !m.taken);
  const allDone = morningRemaining.length === 0 && nightRemaining.length === 0;

  if (timing === "morning") {
    if (morningRemaining.length > 0) {
      const names = morningRemaining.map(m => m.speech).join("、");
      speak(`おはようございます。${names}を飲んでいません。`);
    } else {
      speak("今日の朝のおくすりは全部飲みました。");
    }
  } else {
    if (allDone) {
      speak("今日のおくすりは全部飲みました。お疲れ様でした。");
    } else if (nightRemaining.length > 0) {
      const names = nightRemaining.map(m => m.speech).join("、");
      speak(`夜のおくすりの時間です。${names}を飲んでいません。`);
    } else {
      speak("今日の夜のおくすりは全部飲みました。");
    }
  }
}

/* ===== 日付 ===== */
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
document.getElementById("date").textContent = today();

/* ===== 毎日リセット ===== */
function dailyReset() {
  if (lastDate !== today()) {
    medicines.forEach(m => m.taken = false);
    lastDate = today();
    save();
  }
}

/* ===== 表示 ===== */
function buildList(timing) {
  const list = document.getElementById("list");
  list.innerHTML = "";
  medicines
    .filter(m => m.timing === timing)
    .sort((a, b) => a.order - b.order)
    .forEach(m => {
      const div = document.createElement("div");
      div.className = "medicine" + (m.taken ? " taken" : "");
      div.dataset.id = m.id;
      div.innerHTML = `
        <div class="check"></div>
        <div>${m.name}</div>
      `;
      div.onclick = () => {
        m.taken = !m.taken;
        save();
        speak(m.taken ? `${m.speech}を飲みました` : `${m.speech}のチェックを外しました`);
        updateList(current);
      };
      list.appendChild(div);
    });
}

function updateList(timing) {
  medicines
    .filter(m => m.timing === timing)
    .forEach(m => {
      const div = document.querySelector(`.medicine[data-id="${m.id}"]`);
      if (div) div.classList.toggle("taken", m.taken);
    });
}

function showPage(timing, animate = true) {
  if (timing === current && animate) return;
  current = timing;
  if (animate) {
    applyTheme(timing);
  } else {
    document.body.classList.toggle("night-theme", timing === "night");
  }
  document.getElementById("btn-morning").classList.toggle("active", timing === "morning");
  document.getElementById("btn-night").classList.toggle("active", timing === "night");
  buildList(timing);
}

function applyTheme(timing) {
  document.body.classList.add("lamp-fade");
  setTimeout(() => {
    document.body.classList.toggle("night-theme", timing === "night");
    document.body.classList.remove("lamp-fade");
  }, 250);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    dailyReset();
    showPage(current, false);
    announceStatus();
  }
});

/* ===== Firebaseとのリアルタイム同期 ===== */
dbRef.on("value", (snapshot) => {
  const data = snapshot.val();
  if (data && data.medicines) {
    medicines = data.medicines;
    lastDate = data.lastDate || today();
  } else {
    // Firebaseにまだデータが無い場合は空のまま（初期値は自動投入しない）
    medicines = [];
    lastDate = today();
  }
  saveCache();
  dailyReset();

  if (firstSync) {
    firstSync = false;
    const hour = new Date().getHours();
    current = hour < 15 ? "morning" : "night";
    showPage(current, false);
    announceStatus();
  } else {
    buildList(current);
  }
  setSyncStatus("");
}, () => {
  setSyncStatus("⚠ 同期できていません（オフライン）");
});

/* ===== 起動直後：Firebaseの応答を待つ間はキャッシュを仮表示 ===== */
loadCache();
if (medicines.length > 0) {
  const hour = new Date().getHours();
  current = hour < 15 ? "morning" : "night";
  showPage(current, false);
}
</script>
</body>
</html>
